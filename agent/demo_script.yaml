title: "AETHER — AI Recruitment Decision Support"
pitch: "A recruiter AI that evaluates candidates against job requirements using Strands Decider 2B — advance, review, or decline, with evidence."
features:
  - "load job profiles and candidate resumes in chat"
  - "evaluate compatibility across skills, experience and qualifications"
  - "Strands Decider 2B makes every typed decision: advance / review / decline"
  - "missing information treated as unknown, never as proof of absence"
  - "human review gate: low-confidence evaluations escalated automatically"
  - "AETHER recruiter dashboard with decision confidence and explanation"
eager: false
intro: "AETHER is a recruiter decision-support agent. It talks through Amazon Bedrock and uses Strands Decider 2B to evaluate each candidate against job requirements. The final hiring call always stays with the recruiter."
intro_normal: "AETHER runs on Amazon Bedrock AgentCore Runtime. For each candidate evaluation, Strands Decider 2B classifies the fit as advance, review or decline, with a confidence score the recruiter can act on."
turns:
  - say: "What jobs are we hiring for?"
    narrate: "The recruiter asks AETHER to list open roles."
  - say: "Evaluate candidate C-101 for the Senior Backend Engineer role JD-001"
    narrate: "AETHER fetches the resume and job profile, then Strands Decider 2B classifies the fit."
  - say: "Now evaluate C-102 for the ML Engineer role JD-002"
    narrate: "A less experienced candidate — the decider returns a different confidence score."
  - say: "Evaluate Lin Wei (C-105) for the ML Engineer role JD-002"
    narrate: "A strong ML candidate — the decider classifies this one with high confidence."
  - say: "Why was C-102 flagged for review instead of advanced?"
    narrate: "The recruiter asks for an explanation. AETHER explains using only the evidence in the resume."
outro: "One forward pass per evaluation, typed answers with calibrated confidence, and Amazon Bedrock for the conversation. The recruiter always makes the final call."
